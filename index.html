<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#ff4f81);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
}

.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  animation:fade 0.8s ease;
}

.card{
  width:100%;
  max-width:700px;
  background:rgba(255,255,255,0.16);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:30px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1,h2{
  text-shadow:0 3px 10px rgba(0,0,0,0.15);
}

p{
  line-height:1.7;
}

.btn{
  border:none;
  padding:14px 24px;
  border-radius:30px;
  background:white;
  color:#ff477e;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.btn:active{
  transform:scale(.96);
}

.heart{
  width:180px;
  height:180px;
  margin:0 auto 25px;
  position:relative;
  transform:rotate(-45deg);
  background:#ff174f;
  animation:pulse 1.5s infinite;
  border-radius:20px;
}

.heart:before,
.heart:after{
  content:"";
  width:180px;
  height:180px;
  position:absolute;
  background:#ff174f;
  border-radius:50%;
}

.heart:before{
  top:-90px;
  left:0;
}

.heart:after{
  left:90px;
  top:0;
}

.heartText{
  position:absolute;
  width:250px;
  left:-35px;
  top:65px;
  z-index:2;
  transform:rotate(45deg);
  font-size:20px;
  color:white;
  font-weight:bold;
}

.heartText small{
  font-size:13px;
}

.letter{
  font-size:80px;
  cursor:pointer;
  animation:float 2s infinite ease-in-out;
}

.list{
  text-align:left;
  margin:20px 0;
}

.list div{
  margin:9px 0;
  padding:10px 15px;
  background:rgba(255,255,255,0.12);
  border-radius:15px;
}

.screens{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.placeholder{
  min-height:150px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(255,255,255,0.12);
  border:2px dashed rgba(255,255,255,0.5);
  border-radius:18px;
  padding:15px;
}

.final{
  padding:40px 25px;
}

.guide{
  font-size:13px;
  opacity:.9;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pulse{
  0%,100%{
    transform:rotate(-45deg) scale(1);
  }
  50%{
    transform:rotate(-45deg) scale(1.08);
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
}

@media(max-width:600px){
  .screens{
    grid-template-columns:1fr;
  }

  .card{
    padding:25px 18px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<audio id="music" loop>
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>

const pages = [

`<div class="card">
<div class="heart">
<div class="heartText">
hey my <b>LOVE</b> 💖<br>
<small>This is only for u ❣️</small>
</div>
</div>

<p><b>Open with your headphones 🎧 on</b></p>

<button class="btn" onclick="go(1)">
Yes I am ready
</button>
</div>`,

`<div class="card">

<h1>Happy Birthday my baby 💘</h1>

<p>You deserve a day as beautiful as you are. ❤️</p>

<div class="letter" onclick="go(2)">💌</div>

<p class="guide">♡ Tap the letter to open it ♡</p>

</div>`,

`<div class="card">

<h2>Hey my love 😘</h2>

<p>
Today is your day 💗. I am just a part of this day… maybe a big part 🫠.
</p>

<p>
You came into my life like a spring season and made me feel complete…
You know, I smile like an idiot whenever I see you, darling 💘.
It’s like I adore you endlessly without even realising it…
</p>

<p>
You have become my favourite chapter of my life ♥️.
</p>

<div class="list">

<div>I love your smile.</div>
<div>I love your confidence.</div>
<div>I love how you handle every situation perfectly.</div>
<div>I love your character.</div>
<div>I love your attitude.</div>
<div>I love how you share your problems with me.</div>
<div>I love how you care for your parents.</div>
<div>I love your discipline.</div>
<div>I love your patience.</div>
<div>I love how you comfort me.</div>
<div>I love how you adore me.</div>
<div>I love how you care for me.</div>
<div>I love how you love me.</div>

</div>

<p>It’s like… I love everything about you.</p>

<p>And just always…</p>

<h2>I LOVE YOU ❤️</h2>

<button class="btn" onclick="go(3)">
♡ I want more ♡
</button>

</div>`,

`<div class="card">

<h2>Ohh… my darling wants more 🤗</h2>

<p>
Then come here… 💖<br>
Here are some of the things you’ve said to me that I’ll never forget for the rest of my life. ❤️
</p>

<div class="screens">

${Array.from({length:10},(_,i)=>
`<div class="placeholder">
Screenshot ${i+1}<br>
<small>Replace this with your chat screenshot</small>
</div>`
).join('')}

</div>

<button class="btn" onclick="go(4)">
♡ There’s more… ♡
</button>

</div>`,

`<div class="card">

<h2>Ohh darling… ❤️</h2>

<p>
I could never forget the butterflies you gave me. 💕<br>
The things you did to me… the way you made me feel… 🫠
</p>

<p>
And that online rizz…<br>
OMG… Ufff 🔥😮‍💨
</p>

<p>
Even now, I get butterflies just by remembering those moments, darling. 🦋❤️
</p>

<p>
You have this way of making my heart race without even being here…
and somehow, just the thought of you is enough to make me smile like an idiot. 🥹💗
</p>

<p>
You’re my favourite kind of distraction…<br>
my favourite person to think about…<br>
and definitely my favourite reason to blush. 😏💕
</p>

<p>
<b>I love you… sooooooooooooooooo much. ❤️</b>
</p>

<button class="btn" onclick="go(5)">
♡ One last thing ♡
</button>

</div>`,

`<div class="card final">

<h2>My love… ❤️</h2>

<p>
This little website may end here,<br>
but my love for you never will. 💕
</p>

<p>
Every little thing you saw here was just a small effort from me
to make you smile on your special day. 🥹💗
</p>

<p>
I hope these little moments made you feel even a tiny bit
of how special you are to me. ❤️
</p>

<p>Once again…</p>

<h2>Happy Birthday, my darling! 🎂💓</h2>

<p>
May your smile always stay this beautiful,<br>
and may I always have a reason to be the one smiling because of you. 🫠💕
</p>

<p>
<strong>
I love you…<br>
today, tomorrow, and always. ❤️
</strong>
</p>

<p>
Made with love, just for you ❤️
</p>

</div>`

];

let current = 0;

function render(){
  document.getElementById("app").innerHTML =
    `<div class="page">${pages[current]}</div>`;
}

function go(n){
  current = n;
  render();
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

const music = document.getElementById("music");

function startMusic(){
  music.play().catch(()=>{});
}

document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});
document.addEventListener("keydown",startMusic,{once:true});

render();

</script>

</body>
</html>
